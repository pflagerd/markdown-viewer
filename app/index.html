<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">
<title>Markdown Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/highlight/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/highlight/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <nav id="menubar">
    <button id="file-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu">File</button>
    <div id="file-menu" class="menu" role="menu" aria-label="File" hidden>
      <button type="button" role="menuitem" data-action="open">Open…<kbd>O</kbd></button>
      <hr>
      <div id="recent-wrap">
        <button type="button" role="menuitem" id="recent-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="recent-menu">Recently Viewed<span class="arrow" aria-hidden="true">▸</span></button>
        <div id="recent-menu" class="menu submenu" role="menu" aria-label="Recently Viewed" hidden></div>
      </div>
      <hr>
      <button type="button" role="menuitem" data-action="reload" data-needs-doc disabled>Reload<kbd>F5</kbd></button>
      <hr>
      <button type="button" role="menuitem" data-action="close" data-needs-doc disabled>Close</button>
      <button type="button" role="menuitem" data-action="closeAll" data-needs-doc disabled>Close All</button>
      <hr>
      <button type="button" role="menuitem" data-action="exit">Exit</button>
    </div>
  </nav>
  <span id="filename">No file open</span>
  <span id="status" role="status"></span>
  <button id="install" type="button" hidden>Install</button>
  <div id="tabs" role="tablist" hidden></div>
</header>
<main id="view" class="markdown-body">
  <div id="empty">
    <h1>Markdown Viewer</h1>
    <p>Open a file with <code>markdown-viewer FILE.md</code>, with your file manager's
       <em>Open With</em> menu, or with <strong>File → Open…</strong> above.</p>
    <p id="install-hint" hidden>The launcher and the <em>Open With</em> menu work only after this
       app has been installed. Use the <strong>Install</strong> button above.</p>
  </div>
</main>
<script src="vendor/marked/marked.umd.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/highlight/highlight.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="app.js"></script>
</body>
</html>
